<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TMC Layer Workbench</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#14161a; --panel:#1c1f26; --panel2:#232733; --line:#343a48; --fg:#d8dce6; --dim:#8a92a6;
  --acc:#ffd24a; --acc2:#5ad2ff; --bad:#ff6060; --ok:#6dff9a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:12px/1.35 ui-monospace,Menlo,Consolas,"DejaVu Sans Mono",monospace;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:2px 8px;cursor:pointer}
button:hover{border-color:var(--acc2)}
button.on{background:#2d4a63;border-color:var(--acc2)}
input[type=text],input[type=search]{background:#0f1115;border:1px solid var(--line);border-radius:3px;padding:3px 6px;min-width:0}
select{background:#0f1115;border:1px solid var(--line);border-radius:3px}
label{cursor:pointer;user-select:none;white-space:nowrap}
#app{display:flex;flex-direction:column;height:100%}
#top{background:var(--panel);border-bottom:1px solid var(--line);padding:4px 8px;display:flex;flex-direction:column;gap:3px;flex:none}
#top .row{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
#tbRoom{font-size:13px}
#tbRoom b{color:var(--acc)}
#tbLayers span{margin-right:10px;color:var(--dim)}
#tbLayers span b{color:var(--fg)}
#main{display:flex;flex:1;min-height:0}
#left{width:270px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#left .hd{padding:6px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
#left .hd .r{display:flex;gap:6px;align-items:center}
#q{flex:1}
#count{color:var(--dim)}
#list{flex:1;overflow:auto;padding-bottom:20px}
.grp{cursor:pointer;padding:3px 6px;background:var(--panel2);border-top:1px solid var(--line);position:sticky;top:0;z-index:1;display:flex;justify-content:space-between}
.grp .n{color:var(--dim)}
.grp:hover{color:var(--acc2)}
.rm{padding:2px 6px 2px 18px;cursor:pointer;display:flex;gap:8px;white-space:nowrap}
.rm:hover{background:#262c3a}
.rm.cur{background:#3a3515;color:var(--acc)}
.rm .id{color:var(--dim);width:22px;flex:none}
.rm .nm{flex:1;overflow:hidden;text-overflow:ellipsis}
.rm .sz{color:var(--dim)}
.rm .sp{color:var(--acc2)}
#wsWrap{flex:1;position:relative;min-width:0;display:flex;flex-direction:column}
#ws{position:relative;flex:1;overflow:hidden;background:
  repeating-conic-gradient(#181a20 0% 25%,#15171c 0% 50%) 0 0/24px 24px}
#mini{flex:none;height:26px;background:var(--panel);border-top:1px solid var(--line);display:flex;gap:4px;padding:2px 4px;align-items:center}
#mini button{padding:1px 8px}
.win{position:absolute;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);box-shadow:0 4px 14px #0008;resize:both;overflow:hidden;min-width:160px;min-height:80px}
.win.front{border-color:#56627a}
.win .hd{flex:none;display:flex;align-items:center;gap:6px;padding:2px 4px 2px 8px;background:var(--panel2);cursor:move;user-select:none;border-bottom:1px solid var(--line)}
.win .hd .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:bold}
.win .hd button{padding:0 6px;line-height:16px}
.win .bd{flex:1;min-height:0;display:flex;flex-direction:column}
.tb{flex:none;display:flex;flex-wrap:wrap;gap:4px 10px;padding:3px 6px;border-bottom:1px solid var(--line);align-items:center}
.cv{flex:1;min-height:0;position:relative;background:#0b0c0f}
.cv canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.st{flex:none;padding:2px 6px;border-top:1px solid var(--line);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scroll{flex:1;overflow:auto;min-height:0}
table.f{border-collapse:collapse;width:100%}
table.f td{padding:0 6px;border-bottom:1px solid #262a35;vertical-align:top}
table.f td:first-child{color:var(--dim);white-space:nowrap;width:1%}
.sec{background:#262c3a;padding:2px 6px;color:var(--acc2);font-weight:bold;position:sticky;top:0}
.er{padding:1px 6px;cursor:pointer;white-space:nowrap;display:flex;gap:8px}
.er:hover{background:#262c3a}
.er.sel{background:#173a4d;color:#fff}
.er .k{width:10px;height:10px;margin-top:2px;flex:none;border:1px solid #000}
.er .p{color:var(--dim)}
.er .bad{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:2px 8px}
.warn{color:var(--bad)}
#toast{position:fixed;right:14px;bottom:36px;background:#173a4d;border:1px solid var(--acc2);padding:6px 12px;border-radius:4px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99999}
#toast.on{opacity:1}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#14161acc;z-index:99998;text-align:center}
#msg div{background:var(--panel);border:1px solid var(--line);padding:18px 26px;max-width:560px;line-height:1.6}
#testbox{position:fixed;left:280px;top:60px;z-index:99997;background:#0b0c0f;border:2px solid var(--acc);padding:8px 12px;max-height:80%;overflow:auto;white-space:pre}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="row"><span id="tbRoom">loading...</span></div>
    <div class="row" id="tbLayers"></div>
    <div class="row" id="tbCtl"></div>
  </div>
  <div id="main">
    <div id="left">
      <div class="hd">
        <div class="r"><input type="search" id="q" placeholder="search: 20-00, 0x48, name"><span id="count"></span></div>
        <div class="r"><button id="expandAll">EXPAND</button><button id="collapseAll">COLLAPSE</button></div>
      </div>
      <div id="list"></div>
    </div>
    <div id="wsWrap"><div id="ws"></div><div id="mini"></div></div>
  </div>
</div>
<div id="toast"></div>
<div id="msg"><div id="msgb">Loading maps.json ...</div></div>

<script>
'use strict';
/* TMC layer workbench, stage 2: read-only viewer for maps.json (see README.md).
   The compositing mirrors render_room.py: BG entries, flips, palettes and the
   per-room gfx set come from the file; nothing is read from the ROM here. */

// ---------------------------------------------------------------- helpers
const $ = (s, e) => (e || document).querySelector(s);
const hex = (n, w = 2) => (n < 0 ? '-' : '') + Math.abs(n).toString(16).toUpperCase().padStart(w, '0');
function el(tag, cls, ...kids) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  for (const k of kids) if (k != null) e.append(k);
  return e;
}
function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem('tmcwb.' + k)); localStorage.setItem('tmcwb.' + k, JSON.stringify(v)); } catch (e) { return null; } }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 1800); }

const S = {
  maps: null, areas: [], byKey: new Map(), room: null, key: null,
  layerOn: { BG1: true, BG2: true, BG3: true }, showHidden: false,
  entities: true, labels: true, grid: false, sync: true,
  kindOff: new Set(store('kindOff') || []), filter: '',
  sel: { blocks: [], objs: new Set() },
  bg3cb: 0, objs: [], objByKey: new Map(),
  views: [], cache: [], groupsOpen: store('groupsOpen') || {},
  sprOn: true, spr: { state: 'idle', data: null, pics: new Map(), err: '', views: new Map(), tiles: new Map(), poolDec: new Map(), pools: null },
};
const roomKey = (a, r) => hex(a) + '-' + hex(r);

// ---------------------------------------------------------------- data decoding
function b64(s) { const bin = atob(s), u = new Uint8Array(bin.length); for (let i = 0; i < u.length; i++) u[i] = bin.charCodeAt(i); return u; }
function u16(s) { const b = b64(s); return new Uint16Array(b.buffer, 0, b.length >> 1); }
function bgr555(c) {
  let r = c & 31, g = (c >> 5) & 31, b = (c >> 10) & 31;
  r = r << 3 | r >> 2; g = g << 3 | g >> 2; b = b << 3 | b >> 2;
  return (0xFF000000 | b << 16 | g << 8 | r) >>> 0;
}
const gfxCache = new Map(), metaCache = new Map();
function getGfx(id) {
  let g = gfxCache.get(id);
  if (!g) {
    const raw = S.maps.gfx[id];
    const p = u16(raw.palettes), pal = new Uint32Array(p.length);
    for (let i = 0; i < p.length; i++) pal[i] = bgr555(p[i]);
    g = { vram: b64(raw.vram), pal };
    gfxCache.set(id, g);
  }
  return g;
}
function getMeta(room, set) {
  const k = room.metatiles + '/' + set;
  let m = metaCache.get(k);
  if (!m) {
    const a = S.maps.metatiles[room.metatiles];
    m = a && a[set] ? u16(a[set]) : new Uint16Array(0);
    metaCache.set(k, m);
  }
  return m;
}
function getTypes(room, set) {
  const k = room.metatiles + '/' + set + 'Types';
  let m = metaCache.get(k);
  if (!m) {
    const a = S.maps.metatiles[room.metatiles];
    m = a && a[set + 'Types'] ? u16(a[set + 'Types']) : new Uint16Array(0);
    metaCache.set(k, m);
  }
  return m;
}
function layerData(L) { return L.__d || (L.__d = u16(L.data)); }

// A layer as BG screen entries (RenderMapLayerToSubTileMap for metatile layers).
function tilemapOf(room, L) {
  if (L.__tm) return L.__tm;
  const data = layerData(L);
  let tm;
  if (L.format === 'tilemap') tm = { w8: L.w, h8: L.h, entries: data, oob: 0 };
  else {
    const sub = getMeta(room, L.metatileSet), w = L.w, h = L.h, out = new Uint16Array(w * 2 * h * 2);
    let oob = 0;
    for (let my = 0; my < h; my++) for (let mx = 0; mx < w; mx++) {
      const base = (data[my * w + mx] & 0x3FFF) * 4;
      if (base + 4 > sub.length) { oob++; continue; }
      const o = my * 2 * w * 2 + mx * 2;
      out[o] = sub[base]; out[o + 1] = sub[base + 1]; out[o + w * 2] = sub[base + 2]; out[o + w * 2 + 1] = sub[base + 3];
    }
    tm = { w8: w * 2, h8: h * 2, entries: out, oob };
  }
  L.__tm = tm;
  return tm;
}

// Cached per room: {layers: {BGn: {canvas, buf, w, h}}, comp: {sig: canvas}}
function roomCache(room) {
  if (!room.__c) {
    room.__c = { layers: {}, comp: {} };
    S.cache.push(room);
    while (S.cache.length > 10) { const old = S.cache.shift(); if (old !== S.room) old.__c = null; else S.cache.push(old); }
  }
  return room.__c;
}
function layerFor(room, bg) {
  const L = room.layers[bg];
  if (!L || !L.data) return null;
  if (bg === 'BG3') return Object.assign({}, L, { charBase: S.bg3cb, colors: 16, w: L.w, h: L.h, __d: layerData(L), __tm: L.__tm });
  return L;
}
function getLayer(room, bg) {
  const c = roomCache(room), ck = bg === 'BG3' ? 'BG3/' + S.bg3cb : bg;
  if (c.layers[ck]) return c.layers[ck];
  const L = layerFor(room, bg);
  if (!L) return null;
  const gfx = getGfx(room.gfx), vram = gfx.vram, pal = gfx.pal;
  const tm = tilemapOf(room, L);
  if (bg === 'BG3') room.layers.BG3.__tm = tm;
  const W = tm.w8 * 8, H = tm.h8 * 8;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d'), img = ctx.createImageData(W, H), buf = new Uint32Array(img.data.buffer);
  const cb = (L.charBase || 0) * 0x4000, c256 = L.colors === 256, ent = tm.entries;
  for (let ty = 0; ty < tm.h8; ty++) for (let tx = 0; tx < tm.w8; tx++) {
    const e = ent[ty * tm.w8 + tx], t = e & 0x3FF, hf = (e >> 10) & 1, vf = (e >> 11) & 1, pb = (e >> 12) * 16;
    for (let y = 0; y < 8; y++) {
      const sy = vf ? 7 - y : y, row = (ty * 8 + y) * W + tx * 8;
      for (let x = 0; x < 8; x++) {
        const sx = hf ? 7 - x : x;
        let i;
        if (c256) { const o = cb + t * 64 + sy * 8 + sx; i = o < vram.length ? vram[o] : 0; }
        else {
          const o = cb + t * 32 + sy * 4 + (sx >> 1);
          i = o < vram.length ? (vram[o] >> (4 * (sx & 1))) & 15 : 0;
          if (i) i += pb;
        }
        if (i) buf[row + x] = pal[i];
      }
    }
  }
  ctx.putImageData(img, 0, 0);
  const r = { canvas: cv, buf, w: W, h: H, tm };
  c.layers[ck] = r;
  return r;
}
const bgNum = bg => +bg.slice(2);
function layerIsOn(room, bg) {
  const L = room.layers[bg];
  if (!L || !L.data || !S.layerOn[bg]) return false;
  return L.visible !== false || S.showHidden;
}
// Back to front: higher priority number is further back; at equal priority the higher BG number is behind.
function enabledOrder(room) {
  const a = Object.keys(room.layers).filter(bg => layerIsOn(room, bg));
  const pr = bg => room.layers[bg].priority == null ? 3 : room.layers[bg].priority;
  a.sort((x, y) => (pr(y) - pr(x)) || (bgNum(y) - bgNum(x)));
  return a;
}
function getComposite(room) {
  const order = enabledOrder(room), sig = order.join(',') + (order.includes('BG3') ? '/' + S.bg3cb : '');
  const c = roomCache(room);
  if (c.comp[sig]) return c.comp[sig];
  const cv = document.createElement('canvas'); cv.width = room.width; cv.height = room.height;
  const ctx = cv.getContext('2d'), gfx = getGfx(room.gfx), p0 = gfx.pal[0];
  ctx.fillStyle = 'rgb(' + (p0 & 255) + ',' + (p0 >> 8 & 255) + ',' + (p0 >> 16 & 255) + ')';
  ctx.fillRect(0, 0, cv.width, cv.height);
  for (const bg of order) { const l = getLayer(room, bg); if (l) ctx.drawImage(l.canvas, 0, 0); }
  c.comp = {}; c.comp[sig] = cv;
  return cv;
}

// ---------------------------------------------------------------- sprites (sprites.json, built by sprites.py)
// Entities of a few curated families come with a pre-rendered picture and the reason it looks that way; every other
// OBJECT / ENEMY / NPC / PROJECTILE gets the default sprite of its definition table, marked "default (not curated)".
// The file also carries, per sprite, every animation and frame, so the picker can draw alternatives here (renderFrame,
// a port of render_pieces in sprites.py, checked against its pictures by ?test). The tiles of swapped sprites are
// 20 MB and live in sprites_tiles.json.gz, loaded the first time a picture needs them.
// The files are loaded lazily and are optional: without them the markers are all there is.
function ensureSprites() { return S.spr.promise || (S.spr.promise = loadSprites()); }
async function loadSprites() {
  const sp = S.spr;
  sp.state = 'loading'; syncCtl();
  try {
    const r = await fetch('sprites.json', { cache: 'no-cache' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    setSprites(await r.json());
  } catch (e) { sp.state = 'missing'; sp.err = e.message; syncCtl(); }
}
function setSprites(d) {
  if (d.format !== 'tmc-layer-workbench-sprites') throw new Error('not a sprites.json of this tool');
  if (d.version !== 2) throw new Error('sprites.json is version ' + d.version + ', this viewer needs 2: run build_maps.py again');
  const sp = S.spr;
  sp.data = d; sp.state = 'ready'; sp.pics.clear(); sp.views.clear(); sp.err = '';
  sp.tiles.clear(); sp.poolDec.clear();
  syncCtl(); repaintAll(); renderInfo(); renderEntityList(true);
}
// The swapped tile pools, on first use.
function loadPools() {
  const sp = S.spr;
  if (sp.poolP) return sp.poolP;
  sp.poolP = (async () => {
    const r = await fetch('sprites_tiles.json.gz', { cache: 'no-cache' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await gunzipJson(r.body);
    if (d.format !== 'tmc-layer-workbench-sprite-tiles') throw new Error('not a sprites_tiles.json.gz of this tool');
    sp.pools = d.pools;
  })().catch(e => { sp.poolErr = e.message; sp.pools = {}; });
  return sp.poolP;
}
function poolBytes(sprite) {
  const sp = S.spr;
  if (!sp.pools) return null;
  let b = sp.poolDec.get(sprite);
  if (!b) { b = sp.pools[sprite] ? b64(sp.pools[sprite]) : new Uint8Array(0); sp.poolDec.set(sprite, b); }
  return b;
}
function tilesBytes(key) {
  const sp = S.spr;
  let b = sp.tiles.get(key);
  if (!b) { b = b64(sp.data.tilesets[key]); sp.tiles.set(key, b); }
  return b;
}
// render_pieces (sprites.py) for one frame of a source: {w, h, ox, oy, rgba} or {err, wait}.
function renderFrame(src, frame, flipX, flipY, dx, dy) {
  const D = S.spr.data, cat = D.sprites[src.s];
  if (!cat) return { err: 'sprite ' + src.s + ' is not in the catalog' };
  const pieces = cat.frames[frame];
  if (!pieces || !pieces.length) return { err: 'frame ' + frame + ' has no OAM pieces' };
  let tiles;
  if (src.m === 0) tiles = tilesBytes(src.t);
  else {
    const pool = poolBytes(src.s);
    if (!pool) return { err: 'loading the swapped tiles ...', wait: true };
    const sw = cat.swap && cat.swap[frame];
    if (!sw || !sw[0]) return { err: 'frame ' + frame + ' loads no tiles' };
    tiles = pool.subarray(sw[1] * 32, (sw[1] + sw[0]) * 32);
  }
  const st = D.sizeTable, sub = (flipX ? 0x30 : 0) + (flipY ? 0x60 : 0), placed = [];
  for (const p of pieces) {
    if (p[2] === 3) return { err: 'invalid OBJ shape 3' };
    let x = p[0], y = p[1];
    if (flipY) y = -y;
    if (flipX) x = -x;
    const o = sub + 4 * (p[2] * 4 + p[3]);
    placed.push({ x: x - st[o] + dx, y: y - st[o + 1] + dy, w: st[o + 2], h: st[o + 3], hf: (p[4] & 1) ^ flipX, vf: ((p[4] >> 1) & 1) ^ flipY, clr: (p[4] >> 2) & 1, tile: p[5], pal: p[6] });
  }
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const q of placed) { x0 = Math.min(x0, q.x); y0 = Math.min(y0, q.y); x1 = Math.max(x1, q.x + q.w); y1 = Math.max(y1, q.y + q.h); }
  const W = x1 - x0, H = y1 - y0, buf = new Uint32Array(W * H);
  for (const q of placed) {
    const row = q.clr ? (src.a && q.pal < 6 ? src.a[q.pal] : null) : (q.pal < src.r.length ? src.r[q.pal] : null);
    if (!row) return { err: 'palette row ' + q.pal + (q.clr ? ' (absolute)' : '') + ' is not available' };
    const tw = q.w >> 3;
    if ((q.tile + tw * (q.h >> 3)) * 32 > tiles.length) return { err: 'piece tiles ' + q.tile + '..' + (q.tile + tw * (q.h >> 3) - 1) + ' past the ' + (tiles.length >> 5) + ' tiles of the gfx' };
    for (let yy = 0; yy < q.h; yy++) {
      const sy = q.vf ? q.h - 1 - yy : yy;
      for (let xx = 0; xx < q.w; xx++) {
        const sx = q.hf ? q.w - 1 - xx : xx;
        const b = tiles[(q.tile + (sy >> 3) * tw + (sx >> 3)) * 32 + (sy & 7) * 4 + ((sx & 7) >> 1)], ci = (sx & 1) ? b >> 4 : b & 15;
        if (ci) buf[(q.y - y0 + yy) * W + (q.x - x0 + xx)] = bgr555(row[ci]);
      }
    }
  }
  return { w: W, h: H, ox: x0, oy: y0, rgba: new Uint8ClampedArray(buf.buffer) };
}
// Preview-only transforms of a drawn picture: mirrors about the entity's position, then quarter turns about the picture's centre.
function xformPic(p, fx, fy, rot) {
  let { w, h, ox, oy, rgba } = p;
  if (fx) {
    const o = new Uint8ClampedArray(rgba.length), a = new Uint32Array(rgba.buffer, rgba.byteOffset, w * h), b = new Uint32Array(o.buffer);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) b[y * w + x] = a[y * w + (w - 1 - x)];
    rgba = o; ox = -(ox + w);
  }
  if (fy) {
    const o = new Uint8ClampedArray(rgba.length), a = new Uint32Array(rgba.buffer, rgba.byteOffset, w * h), b = new Uint32Array(o.buffer);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) b[y * w + x] = a[(h - 1 - y) * w + x];
    rgba = o; oy = -(oy + h);
  }
  for (let n = ((rot || 0) / 90) & 3; n > 0; n--) {   // clockwise
    const o = new Uint8ClampedArray(rgba.length), a = new Uint32Array(rgba.buffer, rgba.byteOffset, w * h), b = new Uint32Array(o.buffer);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) b[x * h + (h - 1 - y)] = a[y * w + x];
    const cx = ox + w / 2, cy = oy + h / 2;
    rgba = o; [w, h] = [h, w]; ox = Math.round(cx - w / 2); oy = Math.round(cy - h / 2);
  }
  return { w, h, ox, oy, rgba };
}
function mkPic(p) {
  const cv = document.createElement('canvas'); cv.width = p.w; cv.height = p.h;
  cv.getContext('2d').putImageData(new ImageData(p.rgba, p.w, p.h), 0, 0);
  return { cv, w: p.w, h: p.h, ox: p.ox, oy: p.oy, rgba: p.rgba };

function stepRoom(d) {

// ---------------------------------------------------------------- keyboard
addEventListener('keydown', e => {
  const tag = e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') { if (e.key === 'Escape') e.target.blur(); return; }
  const k = e.key;
  if (e.ctrlKey || e.metaKey) {
    if (k.toLowerCase() === 'c' && !String(getSelection())) { e.preventDefault(); copyInfo(); }
    return;
  }
  if (k === 'ArrowLeft') { moveSel(-1, 0); e.preventDefault(); }
  else if (k === 'ArrowRight') { moveSel(1, 0); e.preventDefault(); }
  else if (k === 'ArrowUp') { moveSel(0, -1); e.preventDefault(); }
  else if (k === 'ArrowDown') { moveSel(0, 1); e.preventDefault(); }
  else if (k === 'Escape') clearSel();
  else if (k === '[') stepRoom(-1);
  else if (k === ']') stepRoom(1);
  else if (k === 'b' || k === 'B') $('#listB').click();
  else if (k === 'e' || k === 'E') $('#ovE').click();
  else if (k === 'p' || k === 'P') $('#ovP').click();
  else if (k === 'l' || k === 'L') $('#ovL').click();
  else if (k === 'g' || k === 'G') $('#ovG').click();
  else if (k === 'y' || k === 'Y') $('#ovS').click();
  else if (k === 'f' || k === 'F') fitAll();
  else if (k === '/') { e.preventDefault(); $('#q').focus(); }
});

// ---------------------------------------------------------------- loading
async function loadMapsFromNetwork() {
  let r = await fetch('maps.json', { cache: 'no-cache' }).catch(() => null);
  if (r && r.ok) { $('#msgb').textContent = 'Parsing maps.json ...'; return await r.json(); }
  r = await fetch('maps.json.gz', { cache: 'no-cache' }).catch(() => null);
  if (r && r.ok) { $('#msgb').textContent = 'Unpacking maps.json.gz ...'; return await gunzipJson(r.body); }
  throw new Error('neither maps.json nor maps.json.gz could be fetched');
}
async function gunzipJson(stream) {
  const ds = stream.pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(ds).text());
}
async function loadFile(f) {
  if (/\.gz$/i.test(f.name)) return gunzipJson(f.stream());
  return JSON.parse(await f.text());
}
function askForFile(err) {
  const b = $('#msgb'); b.textContent = '';
  const p = el('div'); p.textContent = 'Could not load maps.json (' + err.message + '). Run serve.py, or choose / drop maps.json (or maps.json.gz) here.';
  const inp = el('input'); inp.type = 'file'; inp.accept = '.json,.gz';
  inp.onchange = () => inp.files[0] && loadFile(inp.files[0]).then(start).catch(askForFile);
  b.append(p, inp);
  addEventListener('dragover', e => e.preventDefault());
  addEventListener('drop', e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) loadFile(f).then(start).catch(askForFile); });
}
function start(maps) {
  if (maps.format !== 'tmc-layer-workbench-maps') throw new Error('not a maps.json of this tool');
  S.maps = maps; S.areas = maps.areas; S.byKey.clear();
  for (const a of S.areas) for (const r of a.rooms) { r._a = a; S.byKey.set(roomKey(a.id, r.id), r); }
  const o = store('opts'); if (o) Object.assign(S, { entities: o.entities !== false, labels: o.labels !== false, grid: !!o.grid, sync: o.sync !== false, sprOn: o.sprites !== false });
  buildTop();
  buildResult(); buildLayer('BG2'); buildLayer('BG1'); buildLayer('BG3'); buildMap(); buildEntities(); buildInfo(); buildDepth();
  if (store('listHidden')) $('#listB').click();
  applyLayout(false); syncCtl();
  $('#q').oninput = buildList;
  $('#expandAll').onclick = () => { for (const a of S.areas) S.groupsOpen[a.id] = true; store('groupsOpen', S.groupsOpen); buildList(); };
  $('#collapseAll').onclick = () => { S.groupsOpen = {}; for (const a of S.areas) S.groupsOpen[a.id] = false; store('groupsOpen', S.groupsOpen); buildList(); };
  addEventListener('resize', () => { for (const id in wins) wins[id].setRect(wins[id].rect()); });
  let a = 0x20, r = 0;
  const m = /^([0-9a-f]{1,2})-([0-9a-f]{1,2})$/i.exec(new URL(location.href).searchParams.get('room') || '');
  if (m && S.byKey.has(roomKey(parseInt(m[1], 16), parseInt(m[2], 16)))) { a = parseInt(m[1], 16); r = parseInt(m[2], 16); }
  else if (!S.byKey.has(roomKey(a, r))) { a = S.areas[0].id; r = S.areas[0].rooms[0].id; }
  $('#msg').remove();
  addEventListener('dragover', e => e.preventDefault());
  addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f && /sprites/i.test(f.name)) { e.preventDefault(); f.text().then(t => setSprites(JSON.parse(t))).catch(err => toast('sprites.json: ' + err.message)); } });
  openRoom(a, r, false);
  const testMode = new URL(location.href).searchParams.has('test');
  if (testMode) SV.persist = false;   // the self-checks never write a file
  const sprLoaded = ensureSprites();
  const svLoaded = svLoad(), dpLoaded = dpLoad();

// ---------------------------------------------------------------- self-checks (?test)
// Expected values come from render_room.py's compose() (FNV-1a 32 over the room's RGB bytes).
const EXPECT = {"20-00": 1399115066, "20-01": 1176383374, "00-00": 3279241343, "02-00": 3151911497, "48-00": 3865198760, "60-00": 3263227983, "2D-00": 1106148263, "03-01": 1972784561, "70-00": 1216606463, "21-00": 2929800824, "15-00": 2337535438, "88-00": 285133399, "0B-01": 3608816652, "50-00": 2386207617};
// sprites.json pictures (FNV of their RGB), as sprites.py wrote them: [room key, entity index].
const EXPECT_SPR = {"20-00#1": 1306469306, "70-08#1": 2979542157, "70-08#2": 2828932215, "50-05#0": 739655970, "60-03#12": 2979542157, "78-01#4": 3382804929, "0D-02#0": 2136737887,
  // default (not curated) sprites: ENEMY/OCTOROK, OBJECT/FURNITURE, OBJECT/BELL, NPC/ZELDA, ENEMY/KEATON (swapped gfx), PROJECTILE/REMOVABLE_DUST
  "00-00#11": 3122377044, "01-00#29": 934890877, "02-00#0": 1291120833, "02-00#90": 1942049835, "03-06#16": 1448731119, "06-04#2": 1191357100};
function fnv(bytes, stride4) {
  let h = 0x811C9DC5;
  for (let i = 0; i < bytes.length; i += 4) for (let k = 0; k < 3; k++) { h ^= bytes[i + k]; h = Math.imul(h, 0x01000193) >>> 0; }
  return h >>> 0;
}

  let nrooms = 0, nent = 0; for (const a of S.areas) { nrooms += a.rooms.length; for (const r of a.rooms) nent += r.entities.length; }
  chk(S.areas.length === 91, 'areas ' + S.areas.length + ' (91)');
  chk(nrooms === 597, 'rooms ' + nrooms + ' (597)');
  chk(nent === 5135, 'entities ' + nent + ' (5135)');
  const saveOn = Object.assign({}, S.layerOn), saveHid = S.showHidden;
  S.layerOn = { BG1: true, BG2: true, BG3: true }; S.showHidden = false;
  for (const key of Object.keys(EXPECT)) {
    const [a, r] = key.split('-').map(x => parseInt(x, 16)), room = S.byKey.get(key);
    if (!room) { chk(false, key + ' missing'); continue; }
    const t0 = performance.now(), cv = getComposite(room), ms = performance.now() - t0;
    const d = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height).data;
    const h = fnv(d);
    chk(h === EXPECT[key], key + ' ' + (room.name || '') + ' ' + room.width + 'x' + room.height + ' composite hash ' + h.toString(16) + ' vs ' + EXPECT[key].toString(16) + ' (' + ms.toFixed(0) + ' ms)');
  }

  // entity overlay data: the curtain of Gentari's room
  const g = S.byKey.get('20-00'), cur1 = g.entities.find(e => e.idName === 'GENTARI_CURTAIN');
  chk(cur1 && cur1.x === 24 && cur1.y === 80 && cur1.kindName === 'OBJECT', '20-00 has OBJECT/GENTARI_CURTAIN at 24,80');
  // hiding a layer changes the composite
  S.layerOn.BG1 = false; const hNo = fnv(getComposite(S.byKey.get('00-00')).getContext('2d').getImageData(0, 0, 1008, 1008).data);
  chk(hNo !== EXPECT['00-00'], 'hiding BG1 changes the 00-00 composite');
  S.layerOn = saveOn; S.showHidden = saveHid;
  // sprites.json: loaded, and the pictures are what sprites.py rendered

      chk(h === EXPECT_SPR[k], 'sprite ' + k + ' ' + (rec ? rec.family : '?') + ' picture hash ' + (h == null ? 'none' : h.toString(16)) + ' vs ' + EXPECT_SPR[k].toString(16));
    }
